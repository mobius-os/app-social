name: Verify and publish Social community image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  IMAGE_REPOSITORY: ghcr.io/mobius-os/app-social-community

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --requirement deploy/community/requirements.lock

      - name: Run Social tests
        run: npm test

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build the exact candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/community/Dockerfile
          load: true
          push: false
          build-args: |
            SOURCE_SHA=${{ github.sha }}
          tags: mobius-social:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Verify the isolated image contract
        run: deploy/community/verify-image.sh mobius-social:verify "$GITHUB_SHA"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'mobius-os/app-social'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/community/Dockerfile
          push: true
          build-args: |
            SOURCE_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Attest the published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record the immutable release candidate
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'candidate=%s@%s\nsource_sha=%s\n' \
            "$IMAGE_REPOSITORY" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
